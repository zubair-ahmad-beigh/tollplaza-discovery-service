spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:tollplaza_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  toll-data:
    csv-path: classpath:data/toll_plaza_india.csv
    auto-import-on-startup: true

